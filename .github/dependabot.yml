version: 2
updates:
  # npm dependencies
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    open-pull-requests-limit: 0
    labels:
      - 'dependencies'
      - 'security'
    # Tailwind 4 changed how it plugs into the build and broke main (#69,
    # reverted). The move to 4 is its own ticket, so skip major versions.
    ignore:
      - dependency-name: 'tailwindcss'
        update-types:
          - 'version-update:semver-major'
    groups:
      dev-dependencies:
        dependency-type: 'development'
        update-types:
          - 'minor'
          - 'patch'
      production-dependencies:
        dependency-type: 'production'
        update-types:
          - 'patch'

  # GitHub Actions
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    open-pull-requests-limit: 0
    labels:
      - 'dependencies'
      - 'ci'
